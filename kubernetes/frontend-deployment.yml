
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend                # exactly the same label as above
    spec:
      containers:
        - name: frontend
          image: shoplist-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
